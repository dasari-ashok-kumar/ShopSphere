trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Install Node.js

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build Angular application

  - script: |
      test -f dist/ShopSphere/browser/index.html
    displayName: Verify Angular build

  - script: |
    pwd
    ls -la
    ls -R dist
  displayName: 'Check Angular build output'
  
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/dist/ShopSphere/browser'
      artifact: ShopSphere
      publishLocation: pipeline
    displayName: Publish Angular artifact