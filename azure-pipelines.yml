
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Install Node.js

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build Angular application

  - script: |
      echo "Checking Angular output"
      ls -la dist/ShopSphere/browser
      test -f dist/ShopSphere/browser/index.html
    displayName: Verify Angular build

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/dist'
      artifact: ShopSphere
      publishLocation: pipeline
    displayName: Publish Angular artifact

  - task: AzureStaticWebApp@0
    displayName: Deploy to Azure Static Web Apps
    inputs:
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
      app_location: 'dist/ShopSphere/browser'
      api_location: ''
      output_location: ''
      skip_app_build: true
