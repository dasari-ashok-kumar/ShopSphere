```yaml
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: 'shopsphere'
  containerRegistry: 'shopsphereacr.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

steps:
  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '20.x'

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build Angular application

  - script: |
      test -f dist/ShopSphere/browser/index.html
    displayName: Verify Angular build

  - task: Docker@2
    displayName: Build and push Docker image to ACR
    inputs:
      command: buildAndPush
      containerRegistry: 'ShopSphere-ACR-Connection'
      repository: 'shopsphere'
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)'
      tags: |
        $(Build.BuildId)
        latest

  - task: PublishPipelineArtifact@1
    displayName: Publish Angular artifact
    inputs:
      targetPath: '$(Build.SourcesDirectory)/dist/ShopSphere/browser'
      artifact: ShopSphere
      publishLocation: pipeline
```