# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml


trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm run build
    displayName: 'Build Angular application'

  - script: |
      echo "Checking Angular build output..."
      pwd
      ls -la
      find dist -maxdepth 4 -type f -name "index.html"
    displayName: 'Verify Angular build output'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/dist'
      artifact: 'ShopSphere'
      publishLocation: 'pipeline'
    displayName: 'Publish Angular build artifact'

  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web Apps'
    inputs:
      azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
      app_location: '$(Build.SourcesDirectory)/dist/ShopSphere/browser'
      api_location: ''
      output_location: ''
      skip_app_build: true