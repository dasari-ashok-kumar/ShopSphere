
<div class="product-card">
  <div class="product-image">
    <img
      [src]="product.image"
      [alt]="product.name"
    />

    <span class="discount" *ngIf="product.originalPrice">
      {{ ((product.originalPrice - product.price) / product.originalPrice * 100) | number:'1.0-0' }}% OFF
    </span>
  </div>

  <div class="product-details">
    <h3>{{ product.name }}</h3>

    <p class="brand" *ngIf="product.brand">
      {{ product.brand }}
    </p>

    <div class="rating" *ngIf="product.rating">
      ⭐ {{ product.rating }}
    </div>

    <div class="price">
      <span class="current-price">
        ₹{{ product.price }}
      </span>

      <span class="original-price" *ngIf="product.originalPrice">
        ₹{{ product.originalPrice }}
      </span>
    </div>

    <button
        type="button"
        class="add-to-cart"
        (click)="addToCart()">
        Add to Cart
</button>
  </div>
</div>
